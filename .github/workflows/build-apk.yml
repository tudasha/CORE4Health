name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from GitHub UI

jobs:
  build:
    name: Build Core4Health APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java 21 (required by Gradle 8.11+) ────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # ── 3. Node 20 ─────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 4. Install JS dependencies ─────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Create .env from GitHub Secrets ────────────────────
      - name: Create .env file
        run: |
          echo "VITE_API_URL=${{ secrets.VITE_API_URL }}" >> .env
          echo "VITE_WS_URL=${{ secrets.VITE_WS_URL }}"   >> .env

      # ── 6. Build Vite bundle ───────────────────────────────────
      - name: Build web app
        run: npm run build

      # ── 7. Sync Capacitor Android project ─────────────────────
      - name: Sync Capacitor
        run: npx cap sync android

      # ── 8. Make Gradlew executable ─────────────────────────────
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      # ── 9. Build debug APK ─────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # ── 10. Upload APK artifact ────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: core4health-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
